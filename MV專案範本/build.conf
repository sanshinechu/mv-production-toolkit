# build.conf — scripts/build_mv.sh 讀的組裝設定（bash 語法，等號兩邊不要空格）
# 路徑一律相對於這個 MV 資料夾。沒用到的項目留空或整行刪掉。
# 跑法：bash scripts/build_mv.sh "<這個資料夾>" v1

# 片名（成品叫 review/<NAME>_後製_<版本>.mp4）；留空＝資料夾名
NAME=""

# 必填
STORYBOARD="storyboard_v1.md"
MUSIC="music/<歌>.mp3"

# 素材
VIDEOS="videos-raw"
SHOTS=""                 # 有鏡頭還沒影片、要用分鏡圖 Ken Burns 補時才填 shots
SIZE="1920x1080"

# 鏡頭長度調整（逗號分隔，如 cut08,cut35）
STRETCH=""               # 剪掉壞段而變短的鏡，放慢補滿分鏡秒數（最多 2 倍）
FIT=""                   # 首尾幀鏡頭比分鏡長，要加速塞進去的

# 微電影（純音樂 MV 留空）
PROLOGUE=""              # 片頭前導戲秒數
EPILOGUE=""              # 片尾餘韻秒數
AUDIO_CUES=""            # audio/audio_cues.json

# 字幕
SUB_LYRICS=""            # 歌詞 SRT
LYRICS_OFFSET=""         # 歌詞 SRT 已經對好成片時間軸就填 0；留空＝自動平移片頭戲秒數
SUB_DIALOG=""            # 對白 SRT（成片時間軸）
SUB_MARGIN=""            # 字幕離底邊距離，老師偏好下移到最底就填 10

# 封面（接在第一鏡前、靜音）
COVER=""                 # cover.png
COVER_SEC="3"

# 有 post/overlays.py（後製字卡、製作名單）會自動在 make_mv 之後跑，不用在這裡設
